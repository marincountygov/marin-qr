name: Browser regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Install test-only dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzbar0

      - name: Verify decoder imports
        run: |
          python - <<'PY'
          import cv2
          import numpy
          from importlib.metadata import version
          from pyzbar.pyzbar import decode
          print(f"NumPy {numpy.__version__}; OpenCV {cv2.__version__}; Playwright {version('playwright')}; ZBar available")
          PY

      - name: Run full HTTP browser regression suite
        run: bash scripts/check.sh --browser
